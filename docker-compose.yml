name: gymnasium

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GYM_MODEL: ${GYM_MODEL:-}
      OPENCODE_BIN: opencode
      OPENCODE_URL: http://opencode:4096
      OPENCODE_RAG_AGENT: gymnasium
      GYM_MCP_HOST: 0.0.0.0
      GYM_MCP_PORT: 8010
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
    volumes:
      - ${GYMNASIUM_DATA_DIR:-./data}:/data
      - ${GYMNASIUM_REPORTS_DIR:-./reports}:/reports
      - ${OPENCODE_DATA_DIR:-~/.gymnasium-opencode}:/root/.local/share/opencode
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    expose:
      - "8010"
    restart: unless-stopped

  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    volumes:
      - ${OPENCODE_DATA_DIR:-~/.gymnasium-opencode}:/root/.local/share/opencode
    expose:
      - "4096"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4096/global/health',timeout=4).read(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  cloudflared:
    profiles: [tunnel]
    build:
      context: .
      dockerfile: docker/Dockerfile.cloudflared
    environment:
      TUNNEL_NAME: ${TUNNEL_NAME:-}
      APP_HOST: ${APP_HOST:-}
      SKIP_DNS: ${SKIP_DNS:-}
    volumes:
      - ${CLOUDFLARED_DIR:-~/.cloudflared}:/etc/cloudflared
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS https://${APP_HOST:-}/ >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 10s
    restart: unless-stopped
